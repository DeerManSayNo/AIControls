[package]
name = "aicontrols"
version = "0.1.0"
description = "AIControls — UI shell"
edition = "2021"

build = "build.rs"

[lib]
name = "aicontrols"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "aicontrols"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
